<!doctype html>
<html>
  <head>
    <style>
      @keyframes blob-rotate {
        0% {
          border-radius: 60% 40% 30% 70%/60% 30% 70% 40%;
        }
        50% {
          border-radius: 30% 60% 70% 40%/50% 60% 30% 60%;
        }
        100% {
          border-radius: 60% 40% 30% 70%/60% 30% 70% 40%;
        }
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d1117;
        font-family: "Fira Code", monospace;
        color: #f97316;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 30px;
        flex-wrap: wrap;
        padding: 20px;
      }

      h1 {
        margin: 0;
        font-size: 45px;
        font-weight: 700;
      }

      .profile-container {
        position: relative;
        width: 200px;
        height: 200px;
        flex-shrink: 0;
      }

      .blob-animation {
        position: absolute;
        width: 100%;
        height: 100%;
        background: linear-gradient(45deg, #7c3aed, #a855f7);
        animation: blob-rotate 8s ease-in-out infinite;
        z-index: -1;
      }

      .profile-photo {
        position: relative;
        width: 180px;
        height: 180px;
        border-radius: 50%;
        border: 4px solid #fff;
        margin: 10px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Lelo Maurice</h1>
      <div class="profile-container">
        <div class="blob-animation"></div>
        <img src="leloeduk.png" class="profile-photo" alt="Profile" />
      </div>
    </div>
  </body>
</html>
